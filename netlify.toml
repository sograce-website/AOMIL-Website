[build]
  publish = "."

# Canonical URLs intentionally retain the .html suffix. Disable Netlify's
# Pretty URLs post-processing so canonical files are served directly at 200.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects are enumerated in _redirects. Do not use a /:page placeholder here:
# Netlify placeholders also match filenames, so /page.html would become
# /page.html.html and trap canonical URLs in a redirect loop.
